syntax = "proto3";

package shared_proto.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "shared_proto/v1/anime.proto";

// Provider page identifier: provider name, the entity type the page describes, and provider address.
message PageKey {
  string provider = 1;
  EntityType entity_type = 2;
  string address = 3;
}

// A provider page with its URL: a provider-reported URL with its slug when one is known,
// or the provider's canonical page URL otherwise.
message PageSource {
  PageKey page_key = 1;
  string source = 2;
  // The title the page's provider gives it (a character's name for a character page);
  // empty when unknown.
  string title = 3;
}

// One raw response belonging to a provider page, as received from the provider.
message PageResponse {
  string request_name = 1;
  string content_type = 2;
  bytes body = 3;
}

// Provider page payload stored by PostgreSQL Service.
message StoredPage {
  PageKey page_key = 1;
  google.protobuf.Timestamp fetched_at = 2;
  bool is_dead = 3;
  repeated PageResponse responses = 4;
  bool is_not_found = 5;
}

// Approved override for one entity field, applied after every merge.
message FieldCorrection {
  string field_path = 1;
  google.protobuf.Any value = 2;
  string approved_by = 3;
  google.protobuf.Timestamp approved_at = 4;
}

// AI-written text for one field, passed into a merge.
message GeneratedText {
  string field_path = 1;
  string text = 2;
  google.protobuf.Timestamp written_at = 3;
}

// One provider's own claim that the work relates to a target page.
message RelationClaim {
  string provider = 1;
  AnimeRelationType relation_type = 2;
  PageKey target_page = 3;
}

// One provider's facts about an episode, sliced out of the work's page by the work's merge.
message EpisodeListEntry {
  string provider = 1;
  optional string title = 2;
  optional google.protobuf.Timestamp aired_at = 3;
  optional int32 duration_seconds = 4;
  optional bool is_filler = 5;
  optional bool is_recap = 6;
}

// An episode a work lists, with its ID once assigned.
message EpisodeReference {
  string episode_id = 1;
  int32 episode_number = 2;
  string title = 3;
  // The episode's provider pages, each with the URL the work's episode list links it by;
  // empty for a known episode's page whose URL is not stored.
  repeated PageSource page_sources = 4;
  repeated EpisodeListEntry list_entries = 5;
}
