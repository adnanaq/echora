syntax = "proto3";

package enrichment_service.v1;

import "google/protobuf/duration.proto";
import "shared_proto/v1/anime.proto";
import "shared_proto/v1/error.proto";
import "shared_proto/v1/merge.proto";

// RPCs for enrichment pipeline health and execution.
service EnrichmentService {
  // Returns service health/readiness information.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Runs the enrichment pipeline for one selected anime record.
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
  // Fetches raw provider page responses as received without mapping.
  rpc FetchPage(FetchPageRequest) returns (FetchPageResponse);
  // Maps stored pages, merges them into one anime, and applies overrides.
  rpc MergeAnime(MergeAnimeRequest) returns (MergeAnimeResponse);
  // Maps stored episode pages and list entries into one merged episode.
  rpc MergeEpisode(MergeEpisodeRequest) returns (MergeEpisodeResponse);
  // Maps stored character pages and applies corrections into one character.
  rpc MergeCharacter(MergeCharacterRequest) returns (MergeCharacterResponse);
}

// Empty request for health checks.
message HealthRequest {}

message HealthResponse {
  // True when the service is ready to process requests.
  bool healthy = 1;
  // Logical service identifier.
  string service = 2;
  // Optional JSON payload with runtime or dependency details.
  string details_json = 3;
  // Populated when a health-check operation fails.
  shared_proto.v1.ErrorDetails error = 4;
}

message RunPipelineRequest {
  // Input file path for the anime dataset.
  string file_path = 1;
  // Optional row index to process; ignored when invalid or absent.
  optional int32 index = 2;
  // Anime title used to locate the target entry.
  string title = 3;
  // Optional base directory for agent outputs/artifacts.
  string agent_dir = 4;
  // Service names to skip during pipeline execution.
  repeated string skip_services = 5;
  // If provided, run only these service names.
  repeated string only_services = 6;
  // When true, skip character fetching across all sources.
  bool skip_characters = 7;
  // When true, skip episode fetching across all sources.
  bool skip_episodes = 8;
}

message RunPipelineResponse {
  // True when enrichment completed successfully.
  bool success = 1;
  // Absolute or relative path to the generated output artifact.
  string output_path = 2;
  // JSON-encoded enrichment result payload.
  string result_json = 3;
  // Populated when pipeline execution fails.
  shared_proto.v1.ErrorDetails error = 4;
}

// Request to fetch raw provider page responses for one PageKey.
message FetchPageRequest {
  shared_proto.v1.PageKey page_key = 1;
  // Cache freshness bound; zero forces a live fetch.
  google.protobuf.Duration max_age = 2;
}

// StoredPage containing raw responses as received from the provider.
message FetchPageResponse {
  shared_proto.v1.StoredPage page = 1;
}

// Request to merge one anime from its stored pages, corrections, and generated text.
message MergeAnimeRequest {
  string anime_id = 1;
  repeated shared_proto.v1.StoredPage source_pages = 2;
  repeated shared_proto.v1.PageKey partial_source_pages = 3;
  repeated shared_proto.v1.FieldCorrection corrections = 4;
  repeated shared_proto.v1.GeneratedText generated_texts = 5;
  repeated shared_proto.v1.EpisodeReference known_episodes = 6;
}

// Merged anime, its episode references, raw relation claims, and synopsis hash.
message MergeAnimeResponse {
  shared_proto.v1.Anime anime = 1;
  repeated shared_proto.v1.EpisodeReference episodes = 2;
  repeated shared_proto.v1.RelationClaim relation_claims = 3;
  string provider_synopses_hash = 4;
}

// Request to merge one episode from its stored pages, list entries, and corrections.
message MergeEpisodeRequest {
  string episode_id = 1;
  string anime_id = 2;
  repeated shared_proto.v1.StoredPage pages = 3;
  repeated shared_proto.v1.FieldCorrection corrections = 4;
  repeated shared_proto.v1.EpisodeListEntry list_entries = 5;
}

// Merged episode message.
message MergeEpisodeResponse {
  shared_proto.v1.Episode episode = 1;
}

// Request to merge one character from its stored pages and corrections.
message MergeCharacterRequest {
  string character_id = 1;
  repeated shared_proto.v1.StoredPage pages = 2;
  repeated shared_proto.v1.FieldCorrection corrections = 3;
}

// Merged character message.
message MergeCharacterResponse {
  shared_proto.v1.Character character = 1;
}
