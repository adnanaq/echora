# Token budget per BGE-M3 pass (EMBED_MODEL_MAX_TOKENS_PER_PASS) on top of
# chunks of 32, GPU, every other tuned setting on (ECHO-54 finding 31).
name = "token_budget_load"

[service_env]
EMBED_BATCH_MAX_SIZE = "64"
EMBED_MAX_CONCURRENCY = "1"
EMBED_MODEL_CHUNK_SIZE = "32"
QDRANT_QUERY_BATCH_MAX_SIZE = "8"
QDRANT_QUERY_BATCH_CONCURRENCY = "16"
QDRANT_PREFER_GRPC = "true"
QDRANT_SEARCH_RESCORE = "true"
QDRANT_SEARCH_OVERSAMPLING = "4.0"

[load]
test_type = "load"

[load.k6]
RATE = "600"
HOLD = "60s"
WITH_PAYLOAD = "false"

[[variant]]
name = "chunks of 32, budget 256"
[variant.service_env]
EMBED_MODEL_MAX_TOKENS_PER_PASS = "256"
