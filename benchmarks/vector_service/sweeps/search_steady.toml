# A steady 400 searches/s with the recommended settings, to compare the same
# load under different conditions: run it once alone and once while
# diagnostics/simulate_indexing_load.py keeps the GPU busy (ECHO-54
# finding 36).
name = "search_steady"

[service_env]
EMBED_BATCH_MAX_SIZE = "64"
EMBED_MAX_CONCURRENCY = "1"
EMBED_MODEL_CHUNK_SIZE = "32"
QDRANT_QUERY_BATCH_MAX_SIZE = "8"
QDRANT_QUERY_BATCH_CONCURRENCY = "16"
QDRANT_PREFER_GRPC = "true"
QDRANT_SEARCH_RESCORE = "true"
QDRANT_SEARCH_OVERSAMPLING = "4.0"

[load]
test_type = "load"

[load.k6]
RATE = "400"
HOLD = "60s"
WITH_PAYLOAD = "false"

[[variant]]
name = "recommended settings"
[variant.service_env]
