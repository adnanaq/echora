[project]
name = "echora"
version = "0.1.0"
description = "Microservice for anime vector database operations with semantic search capabilities"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Core
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # Vector database
    "qdrant-client==1.19.1",
    # "qdrant-client[fastembed]==1.19.1",  # Uncomment to enable FastEmbed dense provider
    # Embedding models
    "sentence-transformers==6.1.0",
    # FlagEmbedding 1.4.x calls AutoModel.from_pretrained(dtype=...), which
    # transformers accepts from 4.56. sentence-transformers 6 needs 5.x, and
    # transformers 5 keeps huggingface-hub below 2.0.
    "transformers==5.17.0",
    "torch>=2.14.0",
    "open-clip-torch>=3.3.0", # OpenCLIP for vision embeddings
    # Image processing
    "pillow>=12.3.0",
    # HTTP client for external requests
    "aiohttp==3.14.3",
    # Imported directly by the aiohttp cache adapter; aiohttp installs them too
    "multidict>=6.9.1",
    "yarl>=1.25.1",
    # HTTP dependencies
    "requests>=2.34.2",
    "hishel>=1.4.0,<2.0.0",
    "redis>=8.1.0,<9.0.0",
    "rapidfuzz>=3.14.6",
    "jellyfish>=1.2.1",
    "jaconv>=0.5.0",
    "pykakasi>=2.3.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.3",
    "langdetect>=1.0.9",
    "lxml>=5.0.0",
    # "dghs-imgutils>=0.19.0",
    "defusedxml>=0.7.1",
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    "protobuf==7.36.2",
    "flagembedding>=1.4.2",
    # Observability
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-grpc==0.66b0",
    "opentelemetry-instrumentation-aiohttp-client==0.66b0",
    "structlog>=26.1.0",
    "zendriver>=0.17.0",
]

[project.optional-dependencies]
dev = [
    # Testing dependencies
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",      # Pants collects test coverage through it
    "pytest-asyncio==1.4.0",  # Required plugin for async test support
    "pytest-mock==3.15.1",     # Required plugin for mocking
    "grpcio-tools==1.84.0",    # Proto stub generation (referenced by scripts/BUILD)
    "ranx==0.3.21",            # Search accuracy scores (benchmarks/vector_service/quality/measure_qdrant_search.py)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests (require database, models, etc.)",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Pants automatically filters coverage to the transitive closure of test dependencies.
# No need to manually configure source_pkgs - Pants handles this per-library.
relative_files = true
omit = [
    "*/tests/*",
    "**/test_*.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "grpc-stubs>=1.53.0.6",
    "lxml-stubs>=0.5.1",
    "ruff==0.16.9",
    "scikit-learn-stubs>=0.0.3",
    "ty>=0.0.84",
    "types-requests>=2.33.0.20260906",
]

[tool.ty.environment]
# Must stay in sync with requires-python, [tool.ruff] target-version,
# pants.toml interpreter_constraints, and .python-version.
python-version = "3.14"

# Additional search paths for module resolution
# Includes both first-party monorepo libs and custom third-party stubs
extra-paths = [
    "libs/observability/src",
    "libs/common/src",
    "libs/enrichment/src",
    "libs/http_cache/src",
    "libs/qdrant_db/src",
    "libs/vector_db_interface/src",
    "libs/vector_processing/src",
    "apps/enrichment_service/src",
    "apps/vector_service/src",
    "stubs",  # Custom third-party type stubs
]

[tool.ty.src]
# Exclude generated protobuf code from type checking
exclude = [
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_pb2_grpc.py",
]

[tool.ty.analysis]
# Only respect ty: ignore comments, not type: ignore (stricter checking)
# This helps during migration to ensure we're not inheriting mypy suppressions
respect-type-ignore-comments = false

[tool.ruff]
# Same as Black
line-length = 88
target-version = "py314"
# Applies the excludes below to explicitly-passed paths too.
force-exclude = true
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "htmlcov",
    # Generated by scripts/generate-proto.py.
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_pb2_grpc.py",
]

[tool.ruff.lint]
# Enable pycodestyle (E) and Pyflakes (F) codes by default
# Plus isort (I) for import sorting, tryceratops (TRY) for exception handling,
# flake8-bandit (S) for security checks
select = ["E", "F", "I", "N", "S", "TRY", "UP", "W"]

# Never enforce these rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N805",   # First argument should be `self` (false positive for Pydantic validators using `cls`)
    "N817",   # CamelCase imported as acronym (e.g., ElementTree as ET)
    "UP047",  # Generic function type parameters (not needed for Python 3.14)
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806", "N803", "E402", "F841", "F811", "S101", "TRY003"]  # Tests: allow uppercase vars/args, imports not at top, unused vars, redefinitions, assert statements, long exception messages in mocks
"benchmarks/**/tests/**/*.py" = ["N806", "N803", "E402", "F841", "F811", "S101", "S311", "TRY003"]  # Benchmark tool tests: same allowances as tests/, plus seeded random test data
"stubs/**/*.pyi" = ["N801", "N803", "UP046"]  # Stub files: allow non-CapWords names, uppercase args, Generic subclass patterns
"**/*_pb2.py" = ["ALL"]    # Generated protobuf code — do not lint
"**/*_pb2.pyi" = ["ALL"]   # Generated protobuf type stubs — do not lint
"**/*_pb2_grpc.py" = ["ALL"]  # Generated gRPC stubs — do not lint
"**/routes/adapter.py" = ["N802"]  # gRPC servicer methods must match proto PascalCase RPC names

[tool.ruff.format]
# Leave code snippets in Markdown docs as written.
exclude = ["*.md"]
# Use double quotes (Black default)
quote-style = "double"

# Indent with spaces (Black default)
indent-style = "space"

# Respect magic trailing commas (Black default)
skip-magic-trailing-comma = false
