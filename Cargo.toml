[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "deny"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
echora_domain = { path = "crates/echora_domain", version = "0.1.0" }
common = { path = "crates/common", version = "0.1.0" }
echora_protos = { path = "crates/echora_protos", version = "0.1.0" }
postgres_db = { path = "crates/postgres_db", version = "0.1.0" }
temporal_workflows = { path = "crates/temporal_workflows", version = "0.1.0" }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false }
dotenvy = { version = "0.15", default-features = false }
flate2 = { version = "1.1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
mimalloc = { version = "0.1", default-features = false }
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["rt-tokio", "trace", "metrics", "logs"] }
prost = { version = "0.14", default-features = false }
prost-build = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }
protoc-bin-vendored = { version = "3.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
sqlx = { version = "0.8", default-features = false }
temporalio-client = { version = "1.3.0", default-features = false }
temporalio-common = { version = "1.3.0", default-features = false }
temporalio-macros = { version = "1.3.0", default-features = false }
temporalio-sdk = { version = "1.3.0", default-features = false, features = ["envconfig"] }
temporalio-sdk-core = { version = "=0.12.0", default-features = false }
temporalio-workflow = { version = "1.3.0", default-features = false }
tokio = { version = "1.45", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
url = { version = "2.5", default-features = false, features = ["std"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "server", "router"] }
tonic-health = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-opentelemetry = { version = "0.31", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi"] }
uuid = { version = "1.16", default-features = false, features = ["std", "v7"] }
