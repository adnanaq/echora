name: PostgreSQL Lookup Check

on:
  pull_request:
    paths:
      - "libs/common/src/common/models/anime.py"
      - "crates/postgres_db/migrations/**"
      - "scripts/check_postgres_lookup_tables.py"
      - ".github/workflows/postgres-lookup-check.yml"
  push:
    branches: ["main"]
    paths:
      - "libs/common/src/common/models/anime.py"
      - "crates/postgres_db/migrations/**"
      - "scripts/check_postgres_lookup_tables.py"
      - ".github/workflows/postgres-lookup-check.yml"

jobs:
  check-lookup-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check lookup tables match anime.py enums
        run: PYTHONPATH=libs/common/src uv run python scripts/check_postgres_lookup_tables.py
