name: PostgreSQL Schema Check

on:
  pull_request:
    paths:
      - "libs/common/src/common/models/anime.py"
      - "crates/postgres_db/migrations/**"
      - "scripts/check_postgres_schema.py"
      - "tests/scripts/test_check_postgres_schema.py"
      - ".github/workflows/postgres-schema-check.yml"
  push:
    branches: ["main"]
    paths:
      - "libs/common/src/common/models/anime.py"
      - "crates/postgres_db/migrations/**"
      - "scripts/check_postgres_schema.py"
      - "tests/scripts/test_check_postgres_schema.py"
      - ".github/workflows/postgres-schema-check.yml"

jobs:
  check-postgres-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check lookup tables and stored field names match anime.py
        run: PYTHONPATH=libs/common/src uv run python scripts/check_postgres_schema.py
