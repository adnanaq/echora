name: Rust CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".sqlx/**"
      - "crates/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".sqlx/**"
      - "crates/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: echora
          POSTGRES_USER: echora
          POSTGRES_PASSWORD: echora_ci_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U echora -d echora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (offline sqlx check)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests against PostgreSQL 18
        env:
          DATABASE_URL: postgres://echora:echora_ci_password@localhost:5432/echora
        run: cargo test --workspace --locked

  rust-security-and-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust nightly toolchain (for cargo-udeps)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-audit and cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-udeps

      - name: Audit dependencies
        run: cargo audit

      - name: Check unused dependencies
        run: cargo +nightly udeps --workspace --all-targets --locked
