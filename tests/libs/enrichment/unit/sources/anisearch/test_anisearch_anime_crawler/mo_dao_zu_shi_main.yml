description: 'Because of the chaos he has caused in his former life, Wei Wuxian has
  been hated, betrayed and was ultimately killed by the biggest clans. Many years
  later, a lunatic, expelled from his clan because of his homosexuality, performs
  a ritual causing Wei Wuxian’s soul to enter his body. In his new body, Wei Wuxian
  meets old acquaintances, including his arch-enemy Lan Wangji. Wei Wuxian realises
  that there’s more behind the cold and supercilious façade of his former nemesis
  than initially expected.Together they have to face exciting and nerve-wrecking challenges,
  while the past keeps chasing them. This series focuses on the latter aspect. Source:
  www.anisearch.com/anime/13751'
