description: 'At around the age of 12, a lot of children reach an age where they become
  interested in the opposite sex – or find it irritating. Hanabi Ayase initially belongs
  to the second variety. Although she already fantasises and talks about her first
  kiss, all the boys who only annoy her – supposedly – do not interest her at all.
  But when she and Yuuto Takao accidentally kiss during a group work session, the
  two quickly become a couple because, after all, Yuuto was pretty much the only one
  who didn’t tease Hanabi.Hanabi’s best friend, Yui Aoi, is practically a model student.
  Unsurprisingly, she doesn’t like Kazuma Hiyama much at first, as he seems like a
  little delinquent and is only too happy to annoy Yui. But the impression is deceptive:
  after he has helped her, Yui’s heart begins to beat slightly for him. But then she
  becomes the target of another boy who is obviously up to no good. When Kazuma steps
  into the breach because of this, he breaks the ice for good.“12-sai. Kiss, Kirai,
  Suki” tells the story of two fresh couples, but can true love really develop in
  a time full of changes? Source: www.anisearch.com/anime/9589'
