[GLOBAL]
pants_version = "2.33.1"
backend_packages = [
  "pants.backend.python",
  "pants.backend.docker",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
]

[source]
root_patterns = [
  "/",
  "/libs/*/src",
  "/libs/*/tests",
  "/apps/*/src",
  "/stubs",
]

[python]
interpreter_constraints = ["CPython==3.14.*"]
# Tests run from the lockfile at 3rdparty/python/default.lock, generated from
# pyproject.toml with `pants generate-lockfiles`. Regenerate it when dependencies change.
enable_resolves = true
# Lock exactly what installs on this platform; everything runs on Linux x86_64.
resolves_to_lock_style = { "python-default" = "strict" }

[python-infer]
# Enable dependency inference for Python imports
imports = true
# Infer dependencies from string imports
string_imports = true

[pytest]
# Same lockfile as the code, so the pytest that runs the tests is the one they import.
install_from_resolve = "python-default"
requirements = ["//:reqs0#pytest", "//:reqs0#pytest-cov"]
args = ["-v", "--tb=short"]
config_discovery = true

[test]
extra_env_vars = ["ENVIRONMENT=development"]
use_coverage = true

[coverage-py]
# Generate coverage reports for test runs
report = ["console", "html"]
# Fail if coverage is below 80%
fail_under = 80
# Generate HTML report in dist/coverage/
output_dir = "dist/coverage"

[ruff]
config_discovery = true
