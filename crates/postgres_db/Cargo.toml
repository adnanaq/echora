[package]
name = "postgres_db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Error constructors for callers' tests; real errors come from the database driver.
test-util = []

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
flate2 = { workspace = true, features = ["rust_backend"] }
prost = { workspace = true, features = ["derive", "std"] }
sha2 = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
