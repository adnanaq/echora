[package]
name = "update_service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
common.workspace = true
futures.workspace = true
mimalloc.workspace = true
opentelemetry.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
temporal_workflows.workspace = true
# tls-ring gives the client a TLS provider, which TEMPORAL_API_KEY and TEMPORAL_TLS need.
temporalio-client = { workspace = true, features = ["envconfig", "tls-ring"] }
temporalio-common = { workspace = true, features = ["envconfig", "otel", "tls-ring"] }
temporalio-sdk.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tonic = { workspace = true, features = ["gzip"] }
tonic-prost.workspace = true
tracing.workspace = true
url.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
temporal_workflows = { workspace = true, features = ["spike", "test-util"] }
uuid = { workspace = true, features = ["v7"] }
